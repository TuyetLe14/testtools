<div class="flex h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r">
    <div class="p-4 border-b">
      <div class="text-xl font-bold">🧭 Tester Hub</div>
    </div>
    <nav class="p-3 space-y-1">
      <a *ngFor="let it of menu"
         [routerLink]="it.path"
         routerLinkActive="bg-blue-50 text-blue-700"
         class="flex items-center gap-3 px-3 py-2 rounded hover:bg-slate-50">
        <span class="text-lg">{{ it.icon }}</span>
        <span class="text-sm">{{ it.label }}</span>
      </a>
    </nav>
    <div class="mt-auto p-4 text-xs text-gray-500">
      v1.0 — Local Demo
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col">
    <!-- Topbar -->
    <header class="flex items-center justify-between bg-white border-b p-4">
      <div class="flex items-center gap-4">
        <button class="md:hidden p-2 rounded bg-slate-100">☰</button>
        <div class="text-lg font-semibold">{{ title }}</div>
      </div>
      <div class="flex items-center gap-3">
        <input placeholder="Search..." class="hidden md:block border rounded px-3 py-1" />
        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center">TU</div>
      </div>
    </header>

    <!-- Content -->
    <main class="p-6 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
