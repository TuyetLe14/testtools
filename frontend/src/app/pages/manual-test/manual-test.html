<div class="bg-white p-4 rounded shadow">
  <h3 class="text-lg font-semibold">Manual Tests</h3>

  <div class="mt-3 flex gap-3 items-center">
    <label class="text-sm">Project</label>
    <select class="border rounded px-2 py-1" [ngModel]="selectedProjectId" (ngModelChange)="onProjectChange($event)">
      <option [value]="0">-- select --</option>
      <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
    </select>
  </div>

  <div class="mt-4" [formGroup]="newTestForm">
    <div class="mb-2">
      <label class="block text-sm">Title</label>
      <input formControlName="title" class="w-full border rounded px-3 py-2" placeholder="Test case title" />
    </div>

    <div formArrayName="steps" class="space-y-2">
      <div *ngFor="let s of steps.controls; let i = index" class="flex gap-2 items-center">
        <input [formControlName]="i" class="flex-1 border rounded px-3 py-2" placeholder="Step {{ i+1 }}" />
        <button type="button" class="px-3 py-1 bg-slate-100 rounded" (click)="removeStep(i)" [disabled]="i===0">Remove</button>
      </div>
    </div>

    <div class="mt-3 flex gap-2">
      <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded" (click)="addStep()">Add step</button>
      <button type="button" class="px-3 py-1 bg-green-600 text-white rounded" (click)="createTest()">Create</button>
    </div>
  </div>

  <hr class="my-4" />

  <h4 class="text-md font-medium">Test Cases</h4>
  <div *ngIf="isLoading" class="py-4">Loading...</div>
  <ul class="mt-2 divide-y">
    <li *ngFor="let t of testcases" class="py-3 flex justify-between items-start">
      <div>
        <div class="font-medium">{{ t.title }}</div>
        <div class="text-sm text-slate-500">
          <span *ngFor="let s of t.steps; let idx = index">{{ idx+1 }}. {{ s }} <span *ngIf="idx < (t.steps.length-1)">|</span></span>
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <button (click)="runTest(t)" class="px-3 py-1 bg-amber-500 text-white rounded">Run</button>
      </div>
    </li>
  </ul>
</div>
