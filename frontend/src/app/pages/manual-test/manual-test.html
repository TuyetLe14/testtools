<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">🧪 Manual Test Cases</h2>

  <div class="mb-4">
    <label class="block mb-1 font-semibold text-gray-700">Select Project</label>
    <select
      class="border rounded px-2 py-1 w-1/2"
      [ngModel]="selectedProjectId"
      (ngModelChange)="onProjectChange(+$event.target.value)"
    >
      <option value="">-- Choose project --</option>
      <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
    </select>
  </div>

  <div class="mt-4" [formGroup]="form">
    <label class="block mb-2 font-semibold text-gray-700">Title</label>
    <input
      formControlName="title"
      type="text"
      class="border rounded px-3 py-1 w-full mb-3"
      placeholder="Enter test case title"
    />

    <div formArrayName="steps">
      <label class="block mb-2 font-semibold text-gray-700">Steps</label>
      <div *ngFor="let step of steps.controls; let i = index" class="flex items-center mb-2 gap-2">
        <input
          [formControlName]="i"
          type="text"
          class="border rounded px-3 py-1 flex-1"
          placeholder="Describe step {{ i + 1 }}"
        />
        <button type="button" (click)="removeStep(i)" class="bg-red-500 text-white px-2 py-1 rounded">
          ✕
        </button>
      </div>

      <button
        type="button"
        (click)="addStep()"
        class="bg-blue-500 text-white px-3 py-1 rounded mt-2"
      >
        ➕ Add Step
      </button>
    </div>

    <div class="mt-4">
      <button
        type="button"
        (click)="createTest()"
        class="bg-green-600 text-white rounded px-4 py-2 hover:bg-green-700"
      >
        ✅ Create Test
      </button>
    </div>
  </div>

  <div class="mt-6">
    <h3 class="text-xl font-semibold mb-3">Existing Test Cases</h3>

    <div *ngIf="isLoading" class="py-3 text-gray-600">Loading...</div>

    <ul *ngIf="!isLoading && testcases.length > 0" class="divide-y divide-gray-200">
      <li
        *ngFor="let t of testcases"
        class="py-3 flex justify-between items-center hover:bg-gray-50 px-2 rounded"
      >
        <div>
          <p class="font-semibold">{{ t.title }}</p>
          <p class="text-sm text-gray-500">Steps: {{ t.steps }}</p>
        </div>
        <button
          (click)="runTest(t)"
          class="px-3 py-1 bg-amber-500 text-white rounded hover:bg-amber-600"
        >
          ▶ Run
        </button>
      </li>
    </ul>

    <div *ngIf="!isLoading && testcases.length === 0" class="text-gray-500 italic">
      No test cases found.
    </div>
  </div>
</div>
